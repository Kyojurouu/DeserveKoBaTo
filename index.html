<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deserve Ko 'To - Financial Delusion Enabler</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Fredoka for goofy UI, Space Mono for Receipt/Inputs -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Fredoka', 'sans-serif'],
                        mono: ['Space Mono', 'monospace'],
                    },
                    boxShadow: {
                        'brutal': '6px 6px 0px 0px rgba(0,0,0,1)',
                        'brutal-hover': '2px 2px 0px 0px rgba(0,0,0,1)',
                        'brutal-lg': '12px 12px 0px 0px rgba(0,0,0,1)',
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #fde047; /* Bright yellow */
            color: #000;
            transition: background-color 0.5s ease-in-out;
            background-image: radial-gradient(#000000 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            background-position: 0 0;
        }

        /* The CVS Receipt Background */
        .receipt-bg {
            background-color: #fff;
            color: #000;
            position: relative;
            border: 4px solid #000;
        }

        .receipt-edges::before, .receipt-edges::after {
            content: "";
            position: absolute;
            left: -4px;
            right: -4px;
            height: 12px;
            background-size: 24px 24px;
            z-index: 10;
        }
        .receipt-edges::before {
            top: -12px;
            background-image: linear-gradient(45deg, transparent 33.333%, #000 33.333%, #000 66.667%, transparent 66.667%), 
                              linear-gradient(-45deg, transparent 33.333%, #000 33.333%, #000 66.667%, transparent 66.667%);
        }
        .receipt-edges::after {
            bottom: -12px;
            background-image: linear-gradient(45deg, #000 33.333%, transparent 33.333%, transparent 66.667%, #000 66.667%), 
                              linear-gradient(-45deg, #000 33.333%, transparent 33.333%, transparent 66.667%, #000 66.667%);
        }

        /* Goofy States applied to the Body when state changes */
        body.state-approved {
            background-color: #4ade80; /* Bright Green */
        }
        body.state-denied {
            background-color: #f87171; /* Bright Red */
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both 4;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
        
        .brutal-input {
            border: 3px solid #000;
            background-color: #fff;
            font-family: 'Space Mono', monospace;
            transition: all 0.1s;
        }
        .brutal-input:focus {
            outline: none;
            background-color: #fbcfe8; /* Pink 200 */
            box-shadow: 4px 4px 0px 0px #000;
            transform: translate(-4px, -4px);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 font-sans overflow-x-hidden">

    <!-- Main Container -->
    <div id="app-container" class="w-full max-w-md relative z-10 transition-all duration-500">
        
        <!-- App Header -->
        <div class="text-center mb-8 bg-white border-4 border-black p-4 shadow-brutal transform -rotate-2">
            <h1 class="text-4xl font-extrabold tracking-tight text-black uppercase">
                Deserve Ko Ba To?!?
            </h1>
            <p class="text-black font-bold mt-1 text-sm bg-pink-300 inline-block px-2 py-1 border-2 border-black shadow-[2px_2px_0px_0px_#000]">The Financial Delusion Enabler</p>
        </div>

        <!-- ========================================== -->
        <!-- STEP 1: INGESTION VIEW (FORM)              -->
        <!-- ========================================== -->
        <div id="view-form" class="bg-white border-4 border-black p-6 md:p-8 shadow-brutal-lg transition-all duration-300 transform scale-100 opacity-100">
            <!-- Progress indicator -->
            <div class="flex space-x-2 mb-6" id="progress-dots">
                <div id="dot-1" class="h-3 w-1/3 bg-black border-2 border-black transition-colors"></div>
                <div id="dot-2" class="h-3 w-1/3 bg-gray-200 border-2 border-black transition-colors"></div>
                <div id="dot-3" class="h-3 w-1/3 bg-gray-200 border-2 border-black transition-colors"></div>
            </div>

            <form id="delusion-form">

                <!-- STEP 1 -->
                <div id="step-1" class="space-y-6">
                    <div class="space-y-2">
                        <label for="item" class="block text-sm font-bold text-black uppercase">Ano nanaman ba bibilhin mo?</label>
                        <input type="text" id="item" required placeholder="e.g. iPhone 16 Pro Max" 
                               class="brutal-input w-full px-4 py-3 text-sm font-bold text-black placeholder-gray-400 shadow-[2px_2px_0px_0px_#000]">
                    </div>
                    <div class="space-y-2">
                        <label for="cost" class="block text-sm font-bold text-black uppercase">Magkano ba yan? Wag kang sinungaling.</label>
                        <input type="number" id="cost" required placeholder="80000.00" min="0" step="0.01"
                               class="brutal-input w-full px-4 py-3 text-sm font-bold text-black placeholder-gray-400 shadow-[2px_2px_0px_0px_#000]">
                    </div>
                    <button type="button" id="btn-next-1"
                            class="w-full py-4 mt-4 bg-pink-400 hover:bg-pink-300 text-black border-4 border-black font-black text-xl uppercase tracking-wider shadow-brutal hover:shadow-brutal-hover hover:translate-x-[4px] hover:translate-y-[4px] transition-all duration-75">
                        NEXT ➡️
                    </button>
                </div>

                <!-- STEP 2 -->
                <div id="step-2" class="space-y-6 hidden">
                    <div class="space-y-2">
                        <label for="excuse" class="block text-sm font-bold text-black uppercase">Ano ba ginawa mo kaya naging deserve mo 'to?</label>
                        <textarea id="excuse" required rows="4" placeholder="Naka-survive ako ng Monday..." 
                                  class="brutal-input w-full px-4 py-3 text-sm font-bold text-black placeholder-gray-400 resize-none shadow-[2px_2px_0px_0px_#000]"></textarea>
                    </div>
                    <div class="flex gap-2">
                        <button type="button" id="btn-back-2"
                                class="w-1/4 py-4 mt-4 bg-gray-200 hover:bg-gray-300 text-black border-4 border-black font-black text-xl uppercase tracking-wider shadow-brutal hover:shadow-brutal-hover hover:translate-x-[4px] hover:translate-y-[4px] transition-all duration-75">
                            ⬅️
                        </button>
                        <button type="button" id="btn-next-2"
                                class="w-3/4 py-4 mt-4 bg-pink-400 hover:bg-pink-300 text-black border-4 border-black font-black text-xl uppercase tracking-wider shadow-brutal hover:shadow-brutal-hover hover:translate-x-[4px] hover:translate-y-[4px] transition-all duration-75">
                            NEXT ➡️
                        </button>
                    </div>
                </div>

                <!-- STEP 3 -->
                <div id="step-3" class="space-y-6 hidden">
                    <div class="space-y-2">
                        <label for="balance" class="block text-sm font-bold text-black uppercase">Teka, magkano nalang ba talaga natitira sa account mo?</label>
                        <input type="number" id="balance" required placeholder="150.00" min="0" step="0.01"
                               class="brutal-input w-full px-4 py-3 text-sm font-bold text-black placeholder-gray-400 shadow-[2px_2px_0px_0px_#000]">
                    </div>
                    <div class="flex gap-2">
                        <button type="button" id="btn-back-3"
                                class="w-1/4 py-4 mt-4 bg-gray-200 hover:bg-gray-300 text-black border-4 border-black font-black text-xl uppercase tracking-wider shadow-brutal hover:shadow-brutal-hover hover:translate-x-[4px] hover:translate-y-[4px] transition-all duration-75">
                            ⬅️
                        </button>
                        <button type="submit" 
                                class="w-3/4 py-4 mt-4 bg-cyan-400 hover:bg-cyan-300 text-black border-4 border-black font-black text-xl uppercase tracking-wider shadow-brutal hover:shadow-brutal-hover hover:translate-x-[4px] hover:translate-y-[4px] transition-all duration-75 active:bg-cyan-500">
                            CALCULATE 💸
                        </button>
                    </div>
                </div>

            </form>
        </div>

        <!-- ========================================== -->
        <!-- STEP 2: LOADING VIEW                       -->
        <!-- ========================================== -->
        <div id="view-loading" class="hidden flex-col items-center justify-center py-16 space-y-6 opacity-0 transition-opacity duration-300">
            <div class="text-[100px] animate-bounce drop-shadow-[4px_4px_0_rgba(0,0,0,1)]">🤡</div>
            <div class="text-center bg-white border-4 border-black p-4 shadow-brutal transform rotate-2">
                <h2 class="text-2xl font-bold text-black uppercase">Consulting the Oracles...</h2>
                <p class="text-black mt-2 font-mono text-sm font-bold">Applying maximum Girl/Boy Math...</p>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- STEP 3: OUTPUT VIEW (RECEIPT)              -->
        <!-- ========================================== -->
        <div id="view-output" class="hidden opacity-0 transition-opacity duration-500 transform scale-95">
            
            <!-- Receipt Element -->
            <div class="receipt-bg receipt-edges p-6 mx-4 font-mono text-sm shadow-brutal-lg transform -rotate-1 mt-4">
                
                <!-- Receipt Header -->
                <div class="text-center border-b-4 border-dashed border-black pb-5 mb-5">
                    <h2 class="text-3xl font-black uppercase tracking-widest text-black">CVS OF LIES</h2>
                    <p class="text-xs text-black mt-1 uppercase font-bold">Official Delusion Receipt</p>
                    <p class="text-xs text-black mt-2 font-bold" id="receipt-date"></p>
                </div>

                <!-- Cost Breakdown -->
                <div class="space-y-4 border-b-4 border-dashed border-black pb-5 mb-5">
                    <div class="flex justify-between text-black font-black text-lg">
                        <span>ORIGINAL COST:</span>
                        <span id="receipt-original-cost"></span>
                    </div>
                    
                    <!-- Injected Items Go Here -->
                    <div id="receipt-items-container" class="space-y-3 text-xs text-black font-bold mt-4">
                        <!-- Items rendered via JS -->
                    </div>
                </div>

                <!-- Final Calculation -->
                <div class="flex justify-between items-center text-xl font-black border-b-4 border-dashed border-black pb-5 mb-6 text-black bg-yellow-200 p-2 border-2 border-black">
                    <span>GIRL MATH TOTAL:</span>
                    <span id="receipt-final-cost">PHP 0.00</span>
                </div>

                <!-- Verdict Stamp -->
                <div class="text-center mt-8">
                    <div class="py-6">
                        <div id="verdict-badge" class="inline-block px-6 py-2 border-4 text-4xl font-black uppercase tracking-widest transform">
                            <!-- Filled by JS -->
                        </div>
                    </div>
                    <p id="receipt-message" class="text-sm italic text-black font-bold px-2 mt-6">
                        <!-- Filled by JS -->
                    </p>
                </div>

            </div>

            <!-- Reset Button -->
            <button id="btn-reset" 
                    class="w-full mt-12 py-4 bg-pink-400 hover:bg-pink-300 text-black border-4 border-black font-black text-lg uppercase tracking-widest shadow-brutal hover:shadow-brutal-hover hover:translate-x-[4px] hover:translate-y-[4px] transition-all duration-75">
                I Need Another Excuse 😭
            </button>
        </div>

    </div>

    <!-- ========================================== -->
    <!-- APPLICATION LOGIC (Vanilla JS)             -->
    <!-- ========================================== -->
    <script>
        // --- 1. DOM Element Selection ---
        const viewForm = document.getElementById('view-form');
        const viewLoading = document.getElementById('view-loading');
        const viewOutput = document.getElementById('view-output');
        const form = document.getElementById('delusion-form');
        const btnReset = document.getElementById('btn-reset');

        // Form Inputs
        const balanceInput = document.getElementById('balance');
        const itemInput = document.getElementById('item');
        const costInput = document.getElementById('cost');
        const excuseInput = document.getElementById('excuse');

        // Receipt Elements
        const rDate = document.getElementById('receipt-date');
        const rOriginalCost = document.getElementById('receipt-original-cost');
        const rItemsContainer = document.getElementById('receipt-items-container');
        const rVerdictBadge = document.getElementById('verdict-badge');
        const rMessage = document.getElementById('receipt-message');

        // --- 2. Helper Functions ---
        
        // Step Logic
        const step1 = document.getElementById('step-1');
        const step2 = document.getElementById('step-2');
        const step3 = document.getElementById('step-3');
        const dot1 = document.getElementById('dot-1');
        const dot2 = document.getElementById('dot-2');
        const dot3 = document.getElementById('dot-3');

        function goToStep(step) {
            step1.classList.add('hidden');
            step2.classList.add('hidden');
            step3.classList.add('hidden');
            
            dot1.classList.replace('bg-black', 'bg-gray-200');
            dot2.classList.replace('bg-black', 'bg-gray-200');
            dot3.classList.replace('bg-black', 'bg-gray-200');

            if (step >= 1) dot1.classList.replace('bg-gray-200', 'bg-black');
            if (step >= 2) dot2.classList.replace('bg-gray-200', 'bg-black');
            if (step >= 3) dot3.classList.replace('bg-gray-200', 'bg-black');

            if (step === 1) step1.classList.remove('hidden');
            if (step === 2) step2.classList.remove('hidden');
            if (step === 3) step3.classList.remove('hidden');
        }

        document.getElementById('btn-next-1').addEventListener('click', () => {
            if(!itemInput.value || !costInput.value) return itemInput.reportValidity() || costInput.reportValidity();
            goToStep(2);
        });
        document.getElementById('btn-next-2').addEventListener('click', () => {
            if(!excuseInput.value) return excuseInput.reportValidity();
            goToStep(3);
        });
        document.getElementById('btn-back-2').addEventListener('click', () => goToStep(1));
        document.getElementById('btn-back-3').addEventListener('click', () => goToStep(2));

        
        // Currency Formatter
        function formatPHP(amount) {
            return 'PHP ' + parseFloat(amount).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        // Handle UI View Toggling with smooth fade effects
        function showView(viewName) {
            // Hide all
            [viewForm, viewLoading, viewOutput].forEach(el => {
                el.classList.add('hidden');
                el.classList.remove('opacity-100', 'scale-100');
                el.classList.add('opacity-0', 'scale-95');
            });

            // Show selected
            const target = viewName === 'form' ? viewForm : 
                           viewName === 'loading' ? viewLoading : viewOutput;
            
            target.classList.remove('hidden');
            
            // Small delay to trigger CSS transition
            setTimeout(() => {
                target.classList.remove('opacity-0', 'scale-95');
                target.classList.add('opacity-100', 'scale-100');
            }, 50);
        }

        // Update Background Color Glow based on state
        function setBodyState(state) {
            // Remove existing states
            document.body.classList.remove('state-approved', 'state-denied');
            if (state) {
                document.body.classList.add(`state-${state.toLowerCase()}`);
            }
        }

        // --- 3. Gemini API Integration ---
        
        async function calculateDelusion(balance, item, cost, excuse) {
            const endpoint = `http://localhost:3000/api/calculate`;

            const payload = {
                balance: balance,
                item: item,
                cost: cost,
                excuse: excuse
            };

            const response = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error || 'Backend request failed');
            }

            // The backend now returns the parsed JSON directly
            return await response.json();
        }

        // --- 4. Render Output (The Receipt) ---
        
        function renderReceipt(data, originalCost) {
            // Trigger Full Screen Glow
            setBodyState(data.decision);

            // Populate Static Fields
            rDate.textContent = new Date().toLocaleString('en-PH');
            rOriginalCost.textContent = formatPHP(originalCost);
            
            // Populate Deductions Array
            rItemsContainer.innerHTML = '';
            
            if (data.receipt_items && data.receipt_items.length > 0) {
                data.receipt_items.forEach(item => {
                    const itemEl = document.createElement('div');
                    itemEl.className = 'flex justify-between items-start gap-4 pb-2 border-b-2 border-dashed border-gray-300';
                    itemEl.innerHTML = `
                        <span class="break-words w-2/3 uppercase text-[12px] leading-tight">- ${item.description}</span>
                        <span class="whitespace-nowrap w-1/3 text-right bg-red-200 px-1 border-2 border-black shadow-[2px_2px_0_0_#000] transform rotate-1">- ${formatPHP(item.deduction)}</span>
                    `;
                    rItemsContainer.appendChild(itemEl);
                });
            } else {
                rItemsContainer.innerHTML = '<div class="text-center italic">No deductions applied.</div>';
            }

            // Style Verdict Badge like a Rubber Stamp
            rVerdictBadge.textContent = data.decision;
            if (data.decision === 'APPROVED') {
                rVerdictBadge.className = 'inline-block px-8 py-2 border-8 border-green-500 text-green-600 bg-white text-4xl font-black uppercase tracking-widest transform -rotate-12 shadow-[4px_4px_0_0_#22c55e]';
            } else {
                rVerdictBadge.className = 'inline-block px-8 py-2 border-8 border-red-500 text-red-600 bg-white text-4xl font-black uppercase tracking-widest transform rotate-12 shadow-[4px_4px_0_0_#ef4444]';
            }

            // Message Text
            rMessage.textContent = `"${data.verdict_message}"`;
        }

        // --- 5. Event Listeners ---

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const balance = parseFloat(balanceInput.value);
            const item = itemInput.value.trim();
            const cost = parseFloat(costInput.value);
            const excuse = excuseInput.value.trim();

            // Transition to Loading State
            showView('loading');
            setBodyState(null);

            try {
                // Fetch AI Decision from Proxy Backend
                const aiResponse = await calculateDelusion(balance, item, cost, excuse);
                console.log("AI Response:", aiResponse); // For debugging
                
                // Render UI
                renderReceipt(aiResponse, cost);
                showView('output');
            } catch (error) {
                console.error(error);
                alert(`Error: ${error.message}`);
                showView('form'); // Reset UI on error
            }
        });

        btnReset.addEventListener('click', () => {
            showView('form');
            setBodyState(null);
            goToStep(1);
        });

    </script>
</body>
</html>
